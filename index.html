<!doctype html>
<html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>چهارلبه</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171717;color:#eee;font-family:system-ui}header{height:58px;padding:8px 12px;background:#222;display:flex;justify-content:space-between;align-items:center}main{height:calc(100% - 58px);position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}.title{font-weight:800;font-size:20px}.hint{font-size:12px;color:#aaa}
</style><header><div><div class="title">چهارلبه</div><div class="hint">بلوک باید حداقل یک لبهٔ هم‌رنگ با همسایه داشته باشد</div></div><span id="turn">نوبت ۱</span></header><main><canvas id="game"></canvas></main>
<script>
const C=['#d85a55','#5fa85a','#90959b','#d6b15b'],N=['شهر','جنگل','کوه','بیابان'],cv=document.getElementById('game'),x=cv.getContext('2d');let d=1,W,H,s=76,tiles=new Map(),piece=null,rot=0,turn=1;
const K=(a,b)=>a+','+b,dirs=[[0,-1],[1,0],[0,1],[-1,0]];
function R(e,n){n=(n%4+4)%4;return e.slice(4-n).concat(e.slice(0,4-n))}
function rnd(){return{e:[0,1,2,3].map(()=>Math.floor(Math.random()*4))}}
function size(){d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);draw()}
function origin(){if(!tiles.size)return[W/2,H/2];let a=[...tiles].map(q=>q[0].split(',').map(Number)),minx=Math.min(...a.map(q=>q[0]))-2,maxx=Math.max(...a.map(q=>q[0]))+2,miny=Math.min(...a.map(q=>q[1]))-2,maxy=Math.max(...a.map(q=>q[1]))+2;s=Math.max(48,Math.min(92,Math.min((W-24)/(maxx-minx+1),(H-24)/(maxy-miny+1))));return[W/2-(minx+maxx+1)*s/2,H/2-(miny+maxy+1)*s/2]}
function tile(t,px,py,g=false){let q=s-4,e=t.e;x.save();x.globalAlpha=g?.45:1;x.fillStyle='#252525';x.fillRect(px+2,py+2,q,q);let z=Math.max(10,s*.2);x.fillStyle=C[e[0]];x.fillRect(px+2,py+2,q,z);x.fillStyle=C[e[1]];x.fillRect(px+s-z-2,py+2,z,q);x.fillStyle=C[e[2]];x.fillRect(px+2,py+s-z-2,q,z);x.fillStyle=C[e[3]];x.fillRect(px+2,py+2,z,q);x.strokeStyle='#090909';x.strokeRect(px+2.5,py+2.5,q-1,q-1);x.restore()}
function valid(t,a,b){if(!tiles.size)return true;return dirs.some((q,i)=>{let n=tiles.get(K(a+q[0],b+q[1]));return n&&t.e[i]===n.e[(i+2)%4]})}
function draw(){x.clearRect(0,0,W,H);let o=origin();for(let[q,t]of tiles){let[a,b]=q.split(',').map(Number);tile(t,o[0]+a*s,o[1]+b*s)}if(!tiles.size){x.fillStyle='#888';x.textAlign='center';x.font='15px system-ui';x.fillText('بلوک اول را روی نقشه بگذار',W/2,H/2)}}
cv.addEventListener('pointerdown',ev=>{let r=cv.getBoundingClientRect(),o=origin(),a=Math.floor((ev.clientX-r.left-o[0])/s+.5),b=Math.floor((ev.clientY-r.top-o[1])/s+.5),k=K(a,b);if(tiles.has(k)){let t=tiles.get(k);t.e=R(t.e,1);draw();return}if(!piece)piece=rnd();let t={e:R(piece.e,rot)};if(!valid(t,a,b))return;tiles.set(k,t);piece=rnd();rot=0;turn++;document.getElementById('turn').textContent='نوبت '+turn;draw()});
window.addEventListener('resize',size);size();
</script>
